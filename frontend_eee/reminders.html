<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminders - ExpiryRemind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --sidebar-width: 260px; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; }
        .sidebar { width: var(--sidebar-width); height: 100vh; position: fixed; background: white; padding: 2rem 1rem; border-right: 1px solid #e5e7eb; }
        .nav-link { padding: .9rem 1rem; border-radius: 14px; color: #64748b; display: flex; gap: 12px; align-items: center; text-decoration: none; position: relative; }
        .nav-link.active { background: linear-gradient(135deg,#6366f1,#818cf8); color: white; }
        
        /* WhatsApp Style Badge */
        .badge-wa {
            position: absolute; right: 15px; background: #25D366; color: white;
            font-size: 0.7rem; padding: 2px 7px; border-radius: 50px; font-weight: 700;
        }

        .main-content { margin-left: var(--sidebar-width); padding: 2.5rem; }
        
        /* Timeline Cards */
        .timeline-section { margin-bottom: 2rem; }
        .timeline-header { font-size: 1.1rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 10px; }
        .reminder-card {
            background: white; border-radius: 18px; padding: 1.2rem; margin-bottom: 10px;
            border-left: 5px solid #cbd5e1; display: flex; align-items: center; justify-content: space-between;
        }
        .urgent { border-left-color: #ef4444; background: #fff5f5; }
        .warning { border-left-color: #f59e0b; background: #fffbeb; }
    </style>
</head>
<body>

<nav class="sidebar">
    <div class="d-flex align-items-center mb-5 px-3">
        <h5 class="fw-bold mb-0 text-primary">ExpiryRemind</h5>
    </div>
    <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link"><i class="bi bi-grid"></i>Dashboard</a>
        <a href="my-products.html" class="nav-link"><i class="bi bi-box-seam"></i>My Products</a>
        <a href="categories.html" class="nav-link"><i class="bi bi-tags"></i>Categories</a>
        <a href="reminders.html" class="nav-link active">
            <i class="bi bi-bell"></i>Reminders 
            <span class="badge-wa" id="wa-count">0</span>
        </a>
        <hr>
        <a href="login.html" class="nav-link text-danger"><i class="bi bi-box-arrow-left"></i>Logout</a>
    </div>
</nav>

<main class="main-content">
    <h2 class="fw-bold mb-4">Expiry Alerts</h2>

    <div class="timeline-section">
        <div class="timeline-header text-danger"><i class="bi bi-exclamation-octagon-fill"></i> Expiring Today</div>
        <div id="todayList"></div>
    </div>

    <div class="timeline-section">
        <div class="timeline-header text-warning"><i class="bi bi-clock-history"></i> Expiring This Week</div>
        <div id="weekList"></div>
    </div>
</main>

<script>
    async function loadReminders() {
        const todayList = document.getElementById('todayList');
        const weekList = document.getElementById('weekList');
        const badge = document.getElementById('wa-count');

        try {
            const res = await fetch('http://localhost:8080/products');
            const products = await res.json();
            
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const nextWeek = new Date(today.getTime() + 7 * 24 * 60 * 60 * 1000);

            let todayHTML = '', weekHTML = '', alertCount = 0;

            products.forEach(p => {
                const exp = new Date(p.expiryDate);
                const expClean = new Date(exp.getFullYear(), exp.getMonth(), exp.getDate());

                if (expClean.getTime() === today.getTime()) {
                    alertCount++;
                    todayHTML += `
                        <div class="reminder-card urgent">
                            <div><h6 class="fw-bold mb-0">${p.name}</h6><small class="text-muted">Consume immediately!</small></div>
                            <span class="badge bg-danger">Urgent</span>
                        </div>`;
                } 
                else if (expClean > today && expClean <= nextWeek) {
                    alertCount++;
                    weekHTML += `
                        <div class="reminder-card warning">
                            <div><h6 class="fw-bold mb-0">${p.name}</h6><small class="text-muted">Expires on ${exp.toLocaleDateString()}</small></div>
                            <span class="badge bg-warning text-dark">Coming Up</span>
                        </div>`;
                }
            });

            todayList.innerHTML = todayHTML || '<p class="text-muted small">No items expiring today.</p>';
            weekList.innerHTML = weekHTML || '<p class="text-muted small">All good for this week!</p>';
            badge.innerText = alertCount;
            if(alertCount === 0) badge.style.display = 'none';

        } catch(e) { console.error("Data fetch failed"); }
    }
    loadReminders();
</script>
</body>
</html>
