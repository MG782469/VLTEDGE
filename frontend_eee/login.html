<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - ExpiryRemind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef2ff, #f8fafc); height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .auth-card { background: white; padding: 2.5rem; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        .form-control { border-radius: 10px; padding: 12px; }
        .btn-primary { background: #6366f1; border: none; border-radius: 10px; padding: 12px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h3 class="fw-bold mb-2">Welcome Back</h3>
        <p class="text-muted small mb-4">Please login to access your dashboard.</p>
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label small fw-bold">Email</label>
                <input type="email" id="email" class="form-control" required>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <p class="text-center mt-3 small">Don't have an account? <a href="signup.html">Register</a></p>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            try {
                const res = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    const result = await res.json();
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('userName', result.user.name);
                    window.location.href = 'dashboard.html';
                } else { alert("Invalid Credentials!"); }
            } catch(err) { alert("Server not running!"); }
        });
    </script>
</body>
</html>
