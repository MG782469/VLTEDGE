<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories - ExpiryRemind</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root{ --sidebar-width:260px; }
body{ font-family:'Plus Jakarta Sans',sans-serif; background:linear-gradient(135deg,#eef2ff,#f8fafc); }

.sidebar{ width:var(--sidebar-width); height:100vh; position:fixed; background:rgba(255,255,255,.75); backdrop-filter:blur(14px); padding:2rem 1rem; border-right:1px solid #e5e7eb; }
.logo-box{ background:linear-gradient(135deg,#6366f1,#4f46e5); box-shadow:0 8px 20px rgba(99,102,241,.4); }
.nav-link{ padding:.9rem 1rem; border-radius:14px; color:#64748b; display:flex; gap:12px; align-items:center; text-decoration: none; }
.nav-link.active{ background:linear-gradient(135deg,#6366f1,#818cf8); color:white; }

.main-content{ margin-left:var(--sidebar-width); padding:2.5rem; }

/* Category Card Design */
.category-card {
    background: white; border-radius: 24px; padding: 1.5rem;
    border: 1px solid rgba(0,0,0,0.05); transition: 0.3s;
    cursor: pointer; position: relative; overflow: hidden;
}
.category-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.08); }
.cat-icon-circle {
    width: 50px; height: 50px; border-radius: 15px;
    display: flex; align-items: center; justify-content: center; font-size: 1.4rem;
    margin-bottom: 1.2rem;
}
.item-count { font-size: 0.85rem; font-weight: 600; color: #6366f1; background: #eef2ff; padding: 4px 12px; border-radius: 20px; }
</style>
</head>

<body>

<nav class="sidebar">
    <div class="d-flex align-items-center mb-5 px-3">
        <div class="logo-box text-white rounded-3 p-2 me-2"><i class="bi bi-calendar2-check-fill"></i></div>
        <h5 class="fw-bold mb-0">ExpiryRemind</h5>
    </div>
    <div class="nav flex-column">
        <a href="dashboard.html" class="nav-link"><i class="bi bi-grid"></i>Dashboard</a>
        <a href="my-products.html" class="nav-link"><i class="bi bi-box-seam"></i>My Products</a>
        <a href="categories.html" class="nav-link active"><i class="bi bi-tags"></i>Categories</a>
        <hr>
        <a href="login.html" class="nav-link text-danger"><i class="bi bi-box-arrow-left"></i>Logout</a>
    </div>
</nav>

<main class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-5">
        <div>
            <h2 class="fw-bold mb-1">Item Categories</h2>
            <p class="text-muted">Explore products by their groups.</p>
        </div>
        <button class="btn btn-primary rounded-pill px-4 py-2" data-bs-toggle="modal" data-bs-target="#customCatModal">
            <i class="bi bi-plus-circle me-2"></i>New Category
        </button>
    </div>

    <div class="row g-4" id="catGrid">
        </div>
</main>

<div class="modal fade" id="customCatModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4">
            <div class="modal-header border-0"><h5 class="fw-bold">Add Custom Category</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
            <div class="modal-body">
                <input type="text" class="form-control mb-3" placeholder="Category Name (e.g. Baby Food)">
                <button class="btn btn-primary w-100 py-2">Create & Organize</button>
            </div>
        </div>
    </div>
</div>

<script>
async function initCategories() {
    try {
        const res = await fetch('http://localhost:8080/products');
        const products = await res.json();

        // Grouping logic (Rule-based)
        const groups = {};
        products.forEach(p => {
            const c = p.category || "General";
            groups[c] = (groups[c] || 0) + 1;
        });

        const catGrid = document.getElementById('catGrid');
        const icons = {
            'Dairy': 'bi-droplet-fill', 'Grocery': 'bi-basket2-fill', 
            'Medicine': 'bi-capsule', 'Snacks': 'bi-cup-hot-fill', 'General': 'bi-tag'
        };

        Object.keys(groups).forEach(name => {
            const icon = icons[name] || 'bi-bookmark-star';
            catGrid.innerHTML += `
                <div class="col-md-4 col-lg-3">
                    <div class="category-card" onclick="location.href='my-products.html?filter=${name}'">
                        <div class="cat-icon-circle bg-primary bg-opacity-10 text-primary">
                            <i class="bi ${icon}"></i>
                        </div>
                        <h5 class="fw-bold mb-2">${name}</h5>
                        <span class="item-count">${groups[name]} Products</span>
                    </div>
                </div>
            `;
        });
    } catch(e) { console.error("Data error"); }
}
initCategories();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
