<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - ExpiryRemind</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .form-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .form-label { font-weight: 600; color: #475569; margin-bottom: 8px; }
        .form-control, .form-select {
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #e2e8f0;
            background: white;
        }
        .form-control:focus, .form-select:focus {
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
            border-color: #6366f1;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            border: none; border-radius: 12px; padding: 14px; font-weight: 700;
        }
        .scan-overlay {
            background: #f1f5f9;
            border: 2px dashed #cbd5e1;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 25px;
        }
        .scan-overlay:hover { background: #e2e8f0; border-color: #6366f1; }
    </style>
</head>
<body>

<div class="form-card">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Add Product</h3>
        <a href="dashboard.html" class="btn-close"></a>
    </div>

    <div class="scan-overlay" onclick="document.getElementById('ocrInput').click()">
        <i class="bi bi-camera fs-2 text-primary"></i>
        <p class="mb-0 mt-2 fw-semibold" id="statusMsg">Scan Expiry from Photo</p>
        <input type="file" id="ocrInput" hidden accept="image/*" onchange="performOCR(this)">
    </div>

    <form id="productForm">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label">Product Name</label>
                <input type="text" id="name" class="form-control" placeholder="e.g. Fresh Milk" required>
            </div>

            <div class="col-12">
                <label class="form-label">Category</label>
                <select id="category" class="form-select" required>
                    <option value="" selected disabled>Select Category</option>
                    <option value="Dairy">Dairy (Milk, Cheese)</option>
                    <option value="Grocery">Grocery (Snacks, Grains)</option>
                    <option value="Medicine">Medicine</option>
                    <option value="Personal Care">Personal Care</option>
                    <option value="Beverages">Beverages</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            
            <div class="col-md-6">
                <label class="form-label">Purchase Date</label>
                <input type="date" id="purchaseDate" class="form-control">
            </div>

            <div class="col-md-6">
                <label class="form-label text-danger">Expiry Date *</label>
                <input type="date" id="expiryDate" class="form-control" required>
            </div>

            <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary w-100">Save Product</button>
            </div>
        </div>
    </form>
</div>

<script>
    document.getElementById('purchaseDate').valueAsDate = new Date();

    document.getElementById('productForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const productData = {
            userId: "12345", 
            name: document.getElementById('name').value,
            category: document.getElementById('category').value, // Category capture kar liya
            purchaseDate: document.getElementById('purchaseDate').value,
            expiryDate: document.getElementById('expiryDate').value
        };

        try {
            const response = await fetch('http://localhost:8080/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(productData)
            });

            if(response.ok) {
                alert('Bhai, category ke sath product save ho gaya!');
                window.location.href = 'dashboard.html';
            }
        } catch (err) {
            alert("Save nahi ho paya. Server check karo.");
        }
    });

    async function performOCR(input) {
        if (!input.files[0]) return;
        
        const status = document.getElementById('statusMsg');
        status.innerText = "Scanning... ⏳";

        const formData = new FormData();
        formData.append('image', input.files[0]);

        try {
            const response = await fetch('http://localhost:8080/api/ocr/extract', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();
            
            if(data.extractedDate && data.extractedDate !== "Not found") {
                status.innerText = "Scan Successful! ✅";
                alert("Found Date: " + data.extractedDate);
                document.getElementById('expiryDate').focus();
            } else {
                status.innerText = "Date nahi mili. Manual bhar do.";
            }
        } catch (err) {
            status.innerText = "OCR Failed! ❌";
        }
    }
</script>
</body>
</html>
